name: Testes

on:
  push:
    branches: [main]
  pull_request:

# O workflow só lê o código: o token do GitHub não precisa de mais permissões.
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Testes no navegador: usam o Google Chrome que já vem no runner (sem baixar navegador).
      - run: npm run test:e2e
